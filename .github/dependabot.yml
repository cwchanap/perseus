version: 2
updates:
  - package-ecosystem: 'bun'
    directories:
      - '/'
      - '/apps/api'
      - '/apps/mobile'
      - '/apps/web'
      - '/apps/workflows'
      - '/packages/game-core'
      - '/packages/infrastructure'
      - '/packages/shared'
      - '/packages/types'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
