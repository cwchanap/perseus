version: 2

updates:
  # JavaScript / TypeScript dependencies across all bun workspaces
  - package-ecosystem: 'bun'
    directories:
      - '/'
      - '/apps/api'
      - '/apps/mobile'
      - '/apps/web'
      - '/apps/workflows'
      - '/packages/game-core'
      - '/packages/infrastructure'
      - '/packages/shared'
      - '/packages/types'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    # @vitest/* packages peer-require exact matching vitest core versions, so any
    # partial bump breaks lockstep: a lone browser-playwright bump hangs
    # browser-mode tests (#129), and a lone vitest core minor breaks
    # expect.element typing against the pinned @vitest/browser (#172). Vitest
    # ecosystem updates are manual, in lockstep, across all workspaces
    # (v5 landed via the coordinated upgrade; see closed #104/#110).
    ignore:
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/browser'
      - dependency-name: '@vitest/browser-playwright'
      - dependency-name: '@vitest/coverage-v8'
      # TS majors are generation jumps (7 = native compiler) that break
      # typescript-eslint/svelte-check and must move in lockstep with mobile's
      # svelte-native pin; upgrade manually across all workspaces.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # Major bumps across ESLint and globals affect the entire linting toolchain
      # (typescript-eslint, eslint-plugin-svelte, etc.) and must move in lockstep
      # across workspaces; upgrade manually.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'globals'
        update-types:
          - 'version-update:semver-major'
      # Mobile is deliberately Svelte 4 for @nativescript-community/svelte-native
      # (pinned via overrides in apps/mobile); any svelte major is a manual,
      # lockstep decision across web and mobile.
      - dependency-name: 'svelte'
        update-types:
          - 'version-update:semver-major'
      # sass-loader majors drop the legacy sass JS API and raise the Node floor,
      # feeding the mobile svelte-native webpack build that CI never exercises;
      # upgrade manually with a device build.
      - dependency-name: 'sass-loader'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      pulumi-minor-and-patch:
        patterns:
          - '@pulumi/*'
        update-types:
          - 'minor'
          - 'patch'
      js-minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@pulumi/*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions versions in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
