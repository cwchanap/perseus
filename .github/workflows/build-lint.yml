name: Build & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Set up web env
        run: cp apps/web/.env.example apps/web/.env

      - name: Run lint
        run: bun run lint

      - name: Lint scripts
        run: bun run lint:scripts

      - name: Run type check
        run: bun run check

      - name: Type check scripts
        run: bun run check:scripts

      - name: Build
        run: bun run build
