name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'packages/infrastructure/**'
      - 'packages/types/**'
      - 'packages/shared/**'
      - 'apps/api/**'
      - 'apps/workflows/**'
      - 'apps/web/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

concurrency:
  # One in-flight deploy per branch. cancel-in-progress is intentionally FALSE:
  # this is an infrastructure deploy that should complete atomically once it
  # starts. With cancel-in-progress: true, frequent pushes to main kept
  # cancelling a deploy mid-flight (often before it cleared the production-env
  # gate on the preview job), so under burst merges a deploy could never
  # finish. Queueing is the safer tradeoff for deploys: each push lands a full,
  # completed `pulumi up`. Note this also means the preview job (below) still
  # inherits the `production` environment's gates — decoupling preview onto a
  # dedicated `pulumi-preview` env (mirroring secrets, no required reviewers)
  # remains the larger deferred mitigation and is an operator task.
  group: pulumi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build --filter=@perseus/web

      - name: Build API worker
        run: bun run build --filter=@perseus/api

      - name: Build workflows worker
        run: bun run build --filter=@perseus/workflows

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: apps/
          retention-days: 1

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [build]
    # Same environment as deploy so environment-scoped secrets
    # (ADMIN_ACCESS_EMAIL, ADMIN_DEVICE_SERIALS, etc.) resolve correctly.
    # TRADEOFF: this inherits all production protection rules (required
    # reviewers, wait timers), so a stuck/pending preview blocks deploys.
    # OPERATOR TODO: create a GitHub Environment `pulumi-preview` that mirrors
    # production secrets/vars but has no required reviewers, then switch this
    # job to `environment: pulumi-preview` so preview cannot deadlock deploy.
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1.0.1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          # personal + user scope is required by auth-actions for OIDC→Pulumi
          # personal tokens today. Prefer an org-scoped token type when Pulumi
          # supports it for this workflow (reduces blast radius of id-token: write).
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Pulumi Preview
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          config-map: |
            cloudflareAccountId:
              value: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ vars.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ vars.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            adminCliServiceTokenDuration:
              value: ${{ vars.ADMIN_CLI_SERVICE_TOKEN_DURATION }}
            googleClientId:
              value: ${{ vars.GOOGLE_CLIENT_ID }}
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, preview] # build: reuse compiled workers/artifacts; preview: deploy only if preview job succeeds (pulumi/actions preview exits 0 on any successful run, regardless of diff)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1.0.1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Install Pulumi CLI
        # pulumi/auth-actions only exchanges the OIDC token for a Pulumi
        # access token; it does NOT install the CLI. The "Read existing D1
        # database ID" step below invokes `pulumi stack output` directly in a
        # shell, so the CLI must be on PATH before that step runs. Without
        # this, every deploy fails at the lookup with "pulumi: command not
        # found" before migrations or Pulumi Up ever run. Using pulumi/actions
        # in installation-only mode (no `command`) matches the version pinned
        # for the Pulumi Up step below.
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1

      - name: Read existing D1 database ID from stack
        # Before running `pulumi up`, check if the D1 database already exists
        # in the Pulumi stack. On subsequent deploys (not the first), the
        # database ID is available from the previous stack checkpoint. We use
        # it to apply additive migrations BEFORE publishing the new Worker
        # code, so the new code never hits a missing-column/missing-table
        # error.
        #
        # On the FIRST deploy, the stack has no D1 output yet (the database
        # doesn't exist until `pulumi up` creates it). In that case
        # EXISTING_DB_ID is empty, and migrations are applied AFTER `pulumi up`
        # (see the "Apply D1 migrations (first deploy)" step below).
        #
        # STACK IS NAMED EXPLICITLY: `pulumi stack output` defaults to the
        # "current" stack, which is selected by `pulumi stack select`. On a
        # fresh GitHub runner no stack is selected, so the command would fail
        # and the `|| echo ""` below would silently treat that failure as
        # "first deploy" — skipping pre-publish migrations on EVERY deploy
        # and restoring the missing-column window this step exists to close.
        # Passing --stack makes the lookup independent of runner state.
        #
        # ERROR DISCRIMINATION: a missing output on a real stack exits
        # non-zero with a "no stack output named 'd1DatabaseId'" message —
        # that is the legitimate first-deploy signal. Authentication, backend,
        # or malformed-state errors also exit non-zero but are NOT first-
        # deploy signals; swallowing them would hide real failures. Keep
        # stdout separate from stderr so Pulumi's login diagnostics cannot be
        # concatenated with the database ID.
        id: read-db-id
        run: |
          set -euo pipefail
          cd packages/infrastructure
          STACK="$PULUMI_ORG/perseus-infrastructure/production"
          STDERR_FILE="$(mktemp)"
          trap 'rm -f "$STDERR_FILE"' EXIT
          set +e
          OUTPUT=$(pulumi stack output d1DatabaseId --stack "$STACK" --non-interactive 2>"$STDERR_FILE")
          STATUS=$?
          set -e
          ERROR_OUTPUT="$(cat "$STDERR_FILE")"
          if [ "$STATUS" -eq 0 ]; then
            EXISTING_DB_ID="$(printf '%s' "$OUTPUT" | tr -d '\r\n')"
            if ! printf '%s' "$EXISTING_DB_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "Pulumi returned an invalid D1 database ID: '$EXISTING_DB_ID'"
              exit 1
            fi
            echo "Existing D1 database ID: '${EXISTING_DB_ID}'"
            echo "db_id=${EXISTING_DB_ID}" >> "$GITHUB_OUTPUT"
          elif printf '%s\n%s' "$OUTPUT" "$ERROR_OUTPUT" | grep -qi "no stack output named"; then
            echo "Stack has no d1DatabaseId output yet — treating as first deploy."
            echo "db_id=" >> "$GITHUB_OUTPUT"
          else
            echo "pulumi stack output failed unexpectedly (exit ${STATUS}):"
            printf '%s\n' "$OUTPUT"
            printf '%s\n' "$ERROR_OUTPUT" >&2
            exit 1
          fi
        env:
          PULUMI_ORG: ${{ vars.PULUMI_ORG }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations (before Worker publish)
        # Apply additive migrations to the EXISTING D1 database BEFORE
        # `pulumi up` publishes the new Worker code. This ensures new columns
        # and tables are present by the time the new Worker version goes live.
        # Only runs when the D1 database already exists (subsequent deploys).
        #
        # MIGRATION SAFETY: This ordering (migrations first, workers second) is
        # safe for ADDITIVE migrations only (new tables, new columns, new
        # indexes). Before shipping a non-additive migration (column rename,
        # type change, column drop, table drop), adopt an expand/contract flow:
        # ship the expand migration + backward-compatible Worker code first,
        # then ship the contract migration after the old Worker version is no
        # longer live.
        if: steps.read-db-id.outputs.db_id != ''
        run: |
          set -euo pipefail
          DB_ID="$EXISTING_DB_ID"
          echo "Applying migrations to existing D1 database $DB_ID (pre-publish)"
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/api/wrangler.production.toml
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/workflows/wrangler.production.toml
          # Mark the foundational migration as applied in wrangler's tracking
          # table ONLY when its schema already exists. The initial migration
          # was applied manually before this workflow existed, so wrangler has
          # no record of it on the current prod DB. Without this bootstrap,
          # `wrangler d1 migrations apply` would re-run 0000 and fail (the
          # migration uses bare CREATE TABLE, not IF NOT EXISTS).
          #
          # The guard is critical for the destroy/recreate path documented in
          # packages/infrastructure/src/resources.ts: on a fresh DB the schema
          # tables do NOT exist, so the guard is false, 0000 is NOT marked as
          # applied, and wrangler runs it normally. An unconditional INSERT
          # here would mark 0000 as applied on a fresh DB, causing wrangler to
          # skip it and leaving the schema empty forever (every D1 query 500s
          # while migrations report success).
          #
          # The DDL matches wrangler's canonical d1_migrations schema exactly
          # (see wrangler's d1/migrations helpers initMigrationsTable) to avoid
          # schema drift that could confuse future wrangler versions.
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)"
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "INSERT OR IGNORE INTO d1_migrations (name) SELECT '0000_true_fantastic_four.sql' WHERE EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='player_profiles')"
          bunx wrangler d1 migrations apply perseus-player-data --remote --config apps/api/wrangler.production.toml
        env:
          EXISTING_DB_ID: ${{ steps.read-db-id.outputs.db_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Pulumi Up
        id: pulumi-up
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          # No `refresh: true` here intentionally. WorkerVersion assets are
          # path-based with no base64 alternative, so refresh fails on a
          # different runner than the one that deployed. Refresh was also the
          # root cause of the May 31 state corruption (a 403 during refresh
          # wrote a checkpoint with an empty magic field). See fbd8749.
          upsert: true
          config-map: |
            cloudflareAccountId:
              value: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ vars.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ vars.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            adminCliServiceTokenDuration:
              value: ${{ vars.ADMIN_CLI_SERVICE_TOKEN_DURATION }}
            googleClientId:
              value: ${{ vars.GOOGLE_CLIENT_ID }}
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations (first deploy)
        # This step only runs on the FIRST deploy, when the D1 database did
        # not exist before `pulumi up` (EXISTING_DB_ID was empty). After
        # `pulumi up` creates the database, we apply migrations for the first
        # time. There is a brief window where the new Worker is live but D1
        # tables don't exist yet — see the FIRST-DEPLOY GAP note in
        # AGENTS.md. For zero-downtime first deploys, run migrations manually
        # before triggering this workflow (see the ZERO-DOWNTIME note below).
        if: steps.read-db-id.outputs.db_id == ''
        run: |
          set -euo pipefail
          DB_ID="$NEW_DB_ID"
          if [ -z "$DB_ID" ]; then
            echo "Pulumi stack output d1DatabaseId is missing; cannot apply migrations safely."
            exit 1
          fi
          if ! printf '%s' "$DB_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Pulumi returned an invalid D1 database ID: '$DB_ID'"
            exit 1
          fi
          echo "Applying migrations to newly created D1 database $DB_ID (first deploy)"
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/api/wrangler.production.toml
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/workflows/wrangler.production.toml
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)"
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "INSERT OR IGNORE INTO d1_migrations (name) SELECT '0000_true_fantastic_four.sql' WHERE EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='player_profiles')"
          bunx wrangler d1 migrations apply perseus-player-data --remote --config apps/api/wrangler.production.toml
        env:
          NEW_DB_ID: ${{ steps.pulumi-up.outputs.d1DatabaseId }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
