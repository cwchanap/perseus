name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'packages/infrastructure/**'
      - 'packages/types/**'
      - 'packages/shared/**'
      - 'apps/api/**'
      - 'apps/workflows/**'
      - 'apps/web/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

concurrency:
  group: pulumi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build --filter=@perseus/web

      - name: Build API worker
        run: bun run build --filter=@perseus/api

      - name: Build workflows worker
        run: bun run build --filter=@perseus/workflows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: apps/
          retention-days: 1

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [build]
    # Same environment as deploy so environment-scoped secrets
    # (ADMIN_ACCESS_EMAIL, ADMIN_DEVICE_SERIALS, etc.) resolve correctly.
    # TRADEOFF: this inherits all production protection rules (required
    # reviewers, wait timers), so a stuck/pending preview blocks deploys.
    # A separate `pulumi-preview` env mirroring the secrets but with no
    # gates would decouple preview from deploy gating — deferred as a
    # team decision (requires configuring a new GitHub environment).
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@v1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Pulumi Preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          config-map: |
            cloudflareAccountId:
              value: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ vars.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ vars.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            adminCliServiceTokenDuration:
              value: ${{ vars.ADMIN_CLI_SERVICE_TOKEN_DURATION }}
            googleClientId:
              value: ${{ vars.GOOGLE_CLIENT_ID }}
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, preview] # build: reuse compiled workers/artifacts; preview: deploy only if preview job succeeds (pulumi/actions preview exits 0 on any successful run, regardless of diff)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@v1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Pulumi Up
        id: pulumi-up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          # No `refresh: true` here intentionally. WorkerVersion assets are
          # path-based with no base64 alternative, so refresh fails on a
          # different runner than the one that deployed. Refresh was also the
          # root cause of the May 31 state corruption (a 403 during refresh
          # wrote a checkpoint with an empty magic field). See fbd8749.
          upsert: true
          config-map: |
            cloudflareAccountId:
              value: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ vars.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ vars.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            adminCliServiceTokenDuration:
              value: ${{ vars.ADMIN_CLI_SERVICE_TOKEN_DURATION }}
            googleClientId:
              value: ${{ vars.GOOGLE_CLIENT_ID }}
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        # Run AFTER Pulumi Up: Pulumi provisions the D1 database resource, then
        # we apply the shared drizzle schema (packages/shared/drizzle). wrangler
        # tracks applied migrations in a d1_migrations table, so re-runs are a
        # no-op — safe to execute on every deploy. migrations_dir is resolved
        # relative to the config file (apps/api), pointing at the checked-out
        # packages/shared/drizzle (build artifacts only cover apps/).
        # FIRST-DEPLOY GAP: Pulumi creates the D1 database AND publishes the
        # Worker in the same `pulumi up`, so the Worker is live before this
        # migrations step runs. On the first-ever deploy, D1-dependent paths
        # can hit missing tables and fail until this step completes:
        #   - POST /api/puzzles/:id/complete → recordCompletion throws → 500
        #   - GET /api/player/* → profile reads/writes → 500
        #   - Workflows setPuzzleStatus (ready/failed) → best-effort, logs and
        #     continues; puzzle stays in KV/DO state, reconciled on next run
        #   - /api/admin/* D1 operations → 500
        # Subsequent deploys are unaffected (tables already exist; additive
        # migrations are no-ops on the live schema).
        #
        # ZERO-DOWNTIME FIRST DEPLOY (optional): before the first production
        # deploy, run migrations manually against the Pulumi-provisioned DB:
        #   pulumi stack output d1DatabaseId --cwd packages/infrastructure
        #   sed -i "s/^database_id = .*/database_id = \"<ID>\"/" apps/api/wrangler.production.toml
        #   bunx wrangler d1 migrations apply perseus-player-data --remote \
        #     --config apps/api/wrangler.production.toml
        # Then trigger this workflow. Alternatively, accept the brief window
        # (low traffic on a brand-new deployment).
        #
        # The database_id is derived from the Pulumi stack output (d1DatabaseId)
        # rather than the static value checked into wrangler.production.toml, so
        # migrations always target the database the Workers are actually bound
        # to — even after a stack destroy/recreate. The static id in the config
        # remains as a fallback for manual `bun run db:migrate` operator runs.
        #
        # MIGRATION SAFETY: This deploy ordering (workers first, migrations
        # second) is safe for ADDITIVE migrations only (new tables, new
        # columns, new indexes). Before shipping a non-additive migration
        # (column rename, type change, column drop, table drop), adopt an
        # expand/contract flow: ship the expand migration + backward-compatible
        # Worker code first, then ship the contract migration after the old
        # Worker version is no longer live.
        run: |
          if [ -z "$DB_ID" ]; then
            echo "Pulumi stack output d1DatabaseId is missing; cannot apply migrations safely."
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/api/wrangler.production.toml
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" apps/workflows/wrangler.production.toml
          # Mark the foundational migration as applied in wrangler's tracking
          # table ONLY when its schema already exists. The initial migration
          # was applied manually before this workflow existed, so wrangler has
          # no record of it on the current prod DB. Without this bootstrap,
          # `wrangler d1 migrations apply` would re-run 0000 and fail (the
          # migration uses bare CREATE TABLE, not IF NOT EXISTS).
          #
          # The guard is critical for the destroy/recreate path documented in
          # packages/infrastructure/src/resources.ts: on a fresh DB the schema
          # tables do NOT exist, so the guard is false, 0000 is NOT marked as
          # applied, and wrangler runs it normally. An unconditional INSERT
          # here would mark 0000 as applied on a fresh DB, causing wrangler to
          # skip it and leaving the schema empty forever (every D1 query 500s
          # while migrations report success).
          #
          # The DDL matches wrangler's canonical d1_migrations schema exactly
          # (see wrangler's d1/migrations helpers initMigrationsTable) to avoid
          # schema drift that could confuse future wrangler versions.
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)"
          bunx wrangler d1 execute perseus-player-data --remote --config apps/api/wrangler.production.toml --command "INSERT OR IGNORE INTO d1_migrations (name) SELECT '0000_true_fantastic_four.sql' WHERE EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='player_profiles')"
          bunx wrangler d1 migrations apply perseus-player-data --remote --config apps/api/wrangler.production.toml
        env:
          DB_ID: ${{ steps.pulumi-up.outputs.d1DatabaseId }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
