name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'packages/infrastructure/**'
      - 'packages/types/**'
      - 'packages/shared/**'
      - 'apps/api/**'
      - 'apps/workflows/**'
      - 'apps/web/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

concurrency:
  group: pulumi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build --filter=@perseus/web

      - name: Build API worker
        run: bun run build --filter=@perseus/api

      - name: Build workflows worker
        run: bun run build --filter=@perseus/workflows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: apps/
          retention-days: 1

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@v1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Pulumi Preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          config-map: |
            cloudflareAccountId:
              value: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ secrets.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ secrets.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientId:
              value: ${{ secrets.GOOGLE_CLIENT_ID }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: apps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install

      - name: Build infrastructure
        run: bun run build --filter=@perseus/infrastructure

      - name: Authenticate with Pulumi
        uses: pulumi/auth-actions@v1
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Pulumi Up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORG }}/perseus-infrastructure/production
          work-dir: packages/infrastructure
          refresh: true
          upsert: true
          config-map: |
            cloudflareAccountId:
              value: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWED_ORIGINS:
              value: ${{ secrets.ALLOWED_ORIGINS }}
            AUTH_REDIRECT_BASE_URL:
              value: ${{ secrets.AUTH_REDIRECT_BASE_URL }}
            adminAccessEmail:
              value: ${{ secrets.ADMIN_ACCESS_EMAIL }}
              secret: true
            adminDeviceSerials:
              value: '${{ secrets.ADMIN_DEVICE_SERIALS }}'
              secret: true
            jwtSecret:
              value: ${{ secrets.JWT_SECRET }}
              secret: true
            adminPasskey:
              value: ${{ secrets.ADMIN_PASSKEY }}
              secret: true
            googleClientId:
              value: ${{ secrets.GOOGLE_CLIENT_ID }}
              secret: true
            googleClientSecret:
              value: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        # Run AFTER Pulumi Up: Pulumi provisions the D1 database resource, then
        # we apply the shared drizzle schema (packages/shared/drizzle). wrangler
        # tracks applied migrations in a d1_migrations table, so re-runs are a
        # no-op — safe to execute on every deploy. migrations_dir is resolved
        # relative to the config file (apps/api), pointing at the checked-out
        # packages/shared/drizzle (build artifacts only cover apps/).
        # First-ever deploy has a brief window where the Worker is live before
        # tables exist; acceptable since profile traffic only starts when users
        # visit the page, by which point this step has completed.
        #
        # MIGRATION SAFETY: This deploy ordering (workers first, migrations
        # second) is safe for ADDITIVE migrations only (new tables, new
        # columns, new indexes). Before shipping a non-additive migration
        # (column rename, type change, column drop, table drop), adopt an
        # expand/contract flow: ship the expand migration + backward-compatible
        # Worker code first, then ship the contract migration after the old
        # Worker version is no longer live.
        run: bunx wrangler d1 migrations apply perseus-player-data --remote --config apps/api/wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
