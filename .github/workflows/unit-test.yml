name: Unit Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

permissions:
  contents: read

jobs:
  unit-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Run script tests
        run: |
          set -o pipefail
          bun run test:scripts 2>&1 | tee script-test-output.log

      - name: Upload script test failure output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: script-test-output
          path: script-test-output.log
          retention-days: 1

      - name: Run shell script tests
        run: bun run test:shell

      - name: Install Chromium
        run: bun run --cwd apps/web test:install-browsers:chromium

      - name: Run unit tests with coverage
        run: bun run test:unit

      - name: Run web bun:test invariants
        run: bun test apps/web/vite-plugins apps/web/scripts apps/web/e2e/gameplay-fixtures/builder.test.ts apps/web/e2e/gameplay-fixtures/catalog.test.ts apps/web/e2e/gameplay-fixtures/assets.test.ts

      - name: Upload LCOV reports for triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: apps/*/coverage/lcov.info
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/*/coverage/lcov.info
          flags: unittest
          fail_ci_if_error: true
