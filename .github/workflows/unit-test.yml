name: Unit Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

permissions:
  contents: read

jobs:
  unit-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Run script tests
        run: |
          set -o pipefail
          bun run test:scripts 2>&1 | tee script-test-output.log

      - name: Upload script test failure output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: script-test-output
          path: script-test-output.log
          retention-days: 1

      - name: Run shell script tests
        run: bun run test:shell

      - name: Install Chromium
        run: bun run --cwd apps/web test:install-browsers:chromium

      - name: Run unit tests with coverage
        run: bun run test:unit

      - name: Install mobile dependencies
        # apps/mobile is a standalone bun project (not in root workspaces),
        # so root `bun install` and `turbo test:unit` do not cover it. Install
        # and test it separately to keep the 185 mobile unit tests in PR CI.
        run: bun install --frozen-lockfile
        working-directory: apps/mobile

      - name: Run mobile unit tests
        run: bun run test:unit
        working-directory: apps/mobile

      - name: Run web bun:test invariants
        run: bun test apps/web/vite-plugins apps/web/scripts apps/web/e2e/gameplay-fixtures/builder.test.ts apps/web/e2e/gameplay-fixtures/catalog.test.ts apps/web/e2e/gameplay-fixtures/assets.test.ts

      - name: Upload LCOV reports for triage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/lcov.info
            packages/game-core/coverage/lcov.info
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/*/coverage/lcov.info,./packages/game-core/coverage/lcov.info
          flags: unittest
          fail_ci_if_error: true
