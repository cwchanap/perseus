#:schema node_modules/wrangler/config-schema.json
name = "perseus"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Serve static assets from the web app build
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"

# R2 bucket for puzzle assets (environment-specific configs override this)
# The binding name "PUZZLES_BUCKET" is preserved across all environments.
[[r2_buckets]]
binding = "PUZZLES_BUCKET"
bucket_name = "perseus-local"

# KV namespace for puzzle metadata (environment-specific configs must provide this)
# The binding name "PUZZLE_METADATA" is preserved across all environments.
# For production, use wrangler.production.toml which contains the real KV namespace ID.
[[kv_namespaces]]
binding = "PUZZLE_METADATA"
id = "local-dev-kv"
preview_id = "local-dev-kv-preview"

# D1 database for player profile, stats, and puzzle ownership
# migrations_dir points at the shared drizzle output so `wrangler d1 migrations
# apply` finds the schema regardless of which app's config is invoked.
[[d1_databases]]
binding = "DB"
database_name = "perseus-player-data"
database_id = "local-dev-d1"
migrations_dir = "../../packages/shared/drizzle"

[durable_objects]
bindings = [
	{ name = "PUZZLE_METADATA_DO", class_name = "PuzzleMetadataDO", script_name = "workflows" }
]

# Cross-script workflow binding to workflows worker
[[workflows]]
name = "perseus"
binding = "PUZZLE_WORKFLOW"
class_name = "PerseusWorkflow"
script_name = "workflows"

# Environment variables (secrets set via wrangler secret)
[vars]
NODE_ENV = "production"
# ALLOWED_ORIGINS = "https://example.com"
# Player auth callback origin. For local dev, set this in .dev.vars or env.dev.vars.
# AUTH_REDIRECT_BASE_URL = "http://localhost:4690"

# Local development overrides
[env.dev]
name = "perseus-dev"

[env.dev.vars]
NODE_ENV = "development"
# Local dev auth/CORS vars. These are dummy values — production secrets are
# set via `wrangler secret` against wrangler.production.toml. JWT_SECRET must
# be >= 32 chars (MIN_JWT_SECRET_LENGTH in auth.worker.ts).
JWT_SECRET = "local-dev-jwt-secret-not-for-production-use"
ADMIN_PASSKEY = "local-dev-passkey"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,http://localhost:4692"

# Development R2 bucket override
[[env.dev.r2_buckets]]
binding = "PUZZLES_BUCKET"
bucket_name = "perseus-local"

# Development KV namespace with preview_id for local development
[[env.dev.kv_namespaces]]
binding = "PUZZLE_METADATA"
id = "local-dev-kv"
preview_id = "local-dev-kv-preview"

# Development D1 database override
[[env.dev.d1_databases]]
binding = "DB"
database_name = "perseus-player-data"
database_id = "local-dev-d1"
migrations_dir = "../../packages/shared/drizzle"

# Development durable_objects binding to workflows-dev worker
[env.dev.durable_objects]
bindings = [
	{ name = "PUZZLE_METADATA_DO", class_name = "PuzzleMetadataDO", script_name = "workflows-dev" }
]

# Development workflow binding to workflows-dev worker
[[env.dev.workflows]]
name = "perseus-dev"
binding = "PUZZLE_WORKFLOW"
class_name = "PerseusWorkflow"
script_name = "workflows-dev"
