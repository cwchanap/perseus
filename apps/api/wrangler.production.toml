#:schema node_modules/wrangler/config-schema.json
name = "perseus"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Serve static assets from the web app build
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"

# R2 bucket for puzzle assets - production bucket
[[r2_buckets]]
binding = "PUZZLES_BUCKET"
bucket_name = "perseus"

# KV namespace for puzzle metadata - production namespace
# IMPORTANT: Replace the id below with the actual production KV namespace ID.
# The pre-deploy script (scripts/validate-wrangler-config.sh) will block deployment
# if the placeholder is still present. Wrangler does NOT support shell-style variable
# interpolation in TOML files.
[[kv_namespaces]]
binding = "PUZZLE_METADATA"
id = "ae95a94b22e3414ab022c335390c67aa"

# D1 database for player profile, stats, and puzzle ownership
# IMPORTANT: The database_id below must match the Pulumi-managed D1 database
# (provisioned in packages/infrastructure; its ID is exported as
# d1DatabaseId from the stack). If the Pulumi stack is destroyed and
# recreated, this ID must be updated to the new database's ID.
# migrations_dir points at the shared drizzle output so `wrangler d1 migrations
# apply` finds the schema regardless of which app's config is invoked.
[[d1_databases]]
binding = "DB"
database_name = "perseus-player-data"
database_id = "b32ed4d0-c29f-413d-9370-de7bec2c80a7"
migrations_dir = "../../packages/shared/drizzle"

[durable_objects]
bindings = [
	{ name = "PUZZLE_METADATA_DO", class_name = "PuzzleMetadataDO", script_name = "workflows" }
]

# Cross-script workflow binding to workflows worker
[[workflows]]
name = "perseus"
binding = "PUZZLE_WORKFLOW"
class_name = "PerseusWorkflow"
script_name = "workflows"

# Environment variables (secrets set via wrangler secret)
[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://perseus.cwchanap.dev"
AUTH_REDIRECT_BASE_URL = "https://perseus.cwchanap.dev"
