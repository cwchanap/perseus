#:schema node_modules/wrangler/config-schema.json
name = "workflows-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Workflow definition
[[workflows]]
name = "perseus-dev"
binding = "PUZZLE_WORKFLOW"
class_name = "PerseusWorkflow"

# R2 bucket for puzzle assets
[[r2_buckets]]
binding = "PUZZLES_BUCKET"
bucket_name = "perseus-local"

# KV namespace for puzzle metadata - development namespace
# Must match the API's env.dev KV id/preview_id (apps/api/wrangler.toml) so the
# workflow worker reads metadata the API worker writes during local dev.
[[kv_namespaces]]
binding = "PUZZLE_METADATA"
id = "local-dev-kv"
preview_id = "local-dev-kv-preview"

# D1 database for puzzle ownership and player stats
# migrations_dir points at the shared drizzle output so `wrangler d1 migrations
# apply` finds the schema regardless of which app's config is invoked.
[[d1_databases]]
binding = "DB"
database_name = "perseus-player-data"
database_id = "local-dev-d1"
migrations_dir = "../../packages/shared/drizzle"

[durable_objects]
bindings = [
	{ name = "PUZZLE_METADATA_DO", class_name = "PuzzleMetadataDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["PuzzleMetadataDO"]
